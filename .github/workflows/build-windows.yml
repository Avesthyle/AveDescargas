name: Compilar para Windows

on:
  push:
    branches: ["main", "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Descargar FFmpeg portable
        shell: pwsh
        run: |
          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )
          $downloaded = $false
          foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Descargando FFmpeg ($attempt/3): $url"
                Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
                $downloaded = $true
                break
              } catch {
                Write-Warning "Error descargando ${url}: $_"
                Start-Sleep -Seconds 5
              }
            }
            if ($downloaded) { break }
          }
          if (-not $downloaded) { throw "No se pudo descargar FFmpeg desde ningún servidor." }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg\bin | Out-Null
          Copy-Item (Join-Path $bin.DirectoryName "*.exe") ffmpeg\bin\
          Get-ChildItem ffmpeg_tmp -Recurse -Filter LICENSE* | Select-Object -First 1 | Copy-Item -Destination ffmpeg\LICENSE.txt
          "$PWD\ffmpeg\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Tests (lógica + interfaz)
        run: python -m unittest -v test_magnetic_timeline test_media_editor test_media_grabber test_editor_panel_gui

      - name: Compilar ejecutable
        run: pyinstaller --noconfirm AveDescargasEditor.spec

      - name: Comprobar que el ejecutable arranca
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AveDescargasEditor.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "El ejecutable se cerró al arrancar (código $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Host "El ejecutable sigue abierto tras 15 s: OK"

      - name: Preparar ZIP portable (con FFmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\AveDescargasEditor | Out-Null
          Copy-Item dist\AveDescargasEditor.exe release\AveDescargasEditor\
          Copy-Item -Recurse ffmpeg release\AveDescargasEditor\ffmpeg
          Copy-Item docs\LEEME.txt release\AveDescargasEditor\LEEME.txt
          Compress-Archive -Path release\AveDescargasEditor -DestinationPath release\AveDescargasEditor-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AveDescargasEditor-exe
          path: dist/AveDescargasEditor.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AveDescargasEditor-portable
          path: release/AveDescargasEditor-portable.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            dist/AveDescargasEditor.exe
            release/AveDescargasEditor-portable.zip
